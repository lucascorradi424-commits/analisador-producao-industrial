<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Eficiência Industrial</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --background: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --accent: #6366f1;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      padding: 36px;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), #a855f7, var(--success));
    }

    .header-icon {
      font-size: 2.2rem;
      margin-bottom: 12px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .input-container {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 1.1rem;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    .metric {
      margin-top: 24px;
      background: rgba(15, 23, 42, 0.6);
      padding: 20px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .metric-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .metric-item span:last-child {
      font-weight: 600;
      color: var(--text-main);
    }

    .metric-divider {
      margin: 12px 0;
      border-top: 1px dashed var(--border);
    }

    .destination-box {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      background: rgba(79, 70, 229, 0.1);
      border: 1px solid rgba(79, 70, 229, 0.3);
      color: var(--accent);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-icon">🏭</div>
    <h2>Linha de Produção</h2>
    <p>Digite os dados do lote abaixo. O cálculo e o redirecionamento logístico ocorrem automaticamente.</p>
    
    <!-- Campos de Entrada Interativos -->
    <div class="input-container">
      <label for="pecasBoas">✅ Peças Válidas (Boas):</label>
      <input type="number" id="pecasBoas" value="95" min="0" oninput="atualizarSimulador()">
    </div>

    <div class="input-container">
      <label for="pecasDefeito">⚠️ Peças com Defeito:</label>
      <input type="number" id="pecasDefeito" value="5" min="0" oninput="atualizarSimulador()">
    </div>
    
    <!-- Resultados e Destino -->
    <div id="resultado" class="metric">
      <div class="metric-item">
        <span>📦 Total Produzido:</span>
        <span id="val-total">--</span>
      </div>
      <div class="metric-item">
        <span>📊 Qualidade (FTY):</span>
        <span id="val-qualidade">--</span>
      </div>
      
      <div class="metric-divider"></div>

      <div class="destination-box" id="val-destino">
        📍 Próximo Destino: Carregando...
      </div>
    </div>
  </div>

  <script>
    function atualizarSimulador() {
      // Pega os valores direto dos inputs
      const boas = parseInt(document.getElementById("pecasBoas").value) || 0;
      const defeitos = parseInt(document.getElementById("pecasDefeito").value) || 0;
      const total = boas + defeitos;

      // Calcula a qualidade percentual
      const qualidade = total > 0 ? ((boas / total) * 100).toFixed(2) : 0;

      // Atualiza os textos da tela
      document.getElementById("val-total").innerText = total;
      document.getElementById("val-qualidade").innerText = qualidade + "%";

      // Lógica do Destino da Carga
      const destinoEl = document.getElementById("val-destino");
      let destinoTexto = "";
      let corBorda = "";
      let corFundo = "";
      let corTexto = "";

      if (total === 0) {
        destinoTexto = "Insira uma quantidade válida de peças.";
        corBorda = "rgba(148, 163, 184, 0.3)";
        corFundo = "rgba(148, 163, 184, 0.1)";
        corTexto = "var(--text-muted)";
      } else if (qualidade >= 95) {
        destinoTexto = "🚀 Expedição / Estoque Final";
        corBorda = "rgba(16, 185, 129, 0.4)";
        corFundo = "rgba(16, 185, 129, 0.1)";
        corTexto = "var(--success)";
      } else if (qualidade >= 80) {
        destinoTexto = "⚠️ Setor de Retrabalho e Ajustes";
        corBorda = "rgba(245, 158, 11, 0.4)";
        corFundo = "rgba(245, 158, 11, 0.1)";
        corTexto = "var(--warning)";
      } else {
        destinoTexto = "❌ Linha de Refugo (Descarte)";
        corBorda = "rgba(239, 68, 68, 0.4)";
        corFundo = "rgba(239, 68, 68, 0.1)";
        corTexto = "var(--danger)";
      }

      destinoEl.style.borderColor = corBorda;
      destinoEl.style.background = corFundo;
      destinoEl.style.color = corTexto;
      destinoEl.innerHTML = `📍 Próximo Destino: <strong>${destinoTexto}</strong>`;
    }

    // Executa na inicialização da página
    window.onload = atualizarSimulador;
  </script>

</body>
</html>
