<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Eficiência Industrial</title>
  <!-- Google Fonts para tipografia moderna -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --background: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --accent: #6366f1;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      padding: 36px;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), #a855f7, var(--success));
    }

    .header-icon {
      font-size: 2.2rem;
      margin-bottom: 12px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.025em;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 1rem;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    .metric {
      margin-top: 24px;
      background: rgba(15, 23, 42, 0.6);
      padding: 20px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .metric-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .metric-item span:last-child {
      font-weight: 600;
      color: var(--text-main);
    }

    .metric-divider {
      margin: 12px 0;
      border-top: 1px dashed var(--border);
    }

    .destination-box {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(79, 70, 229, 0.1);
      border: 1px solid rgba(79, 70, 229, 0.3);
      color: var(--accent);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-icon">🏭</div>
    <h2>Linha de Produção</h2>
    <p>Insira os dados do lote para calcular a eficiência e determinar o próximo destino logístico.</p>
    
    <div class="form-group">
      <label for="input-boas">Peças Válidas (Boas):</label>
      <input type="number" id="input-boas" min="0" value="95" oninput="calcular()">
    </div>

    <div class="form-group">
      <label for="input-defeitos">Peças com Defeito:</label>
      <input type="number" id="input-defeitos" min="0" value="5" oninput="calcular()">
    </div>
    
    <div id="resultado" class="metric">
      <div class="metric-item">
        <span>📦 Total Produzido:</span>
        <span id="val-total">--</span>
      </div>
      <div class="metric-item">
        <span>📊 Qualidade (FTY):</span>
        <span id="val-qualidade">--</span>
      </div>
      
      <div class="metric-divider"></div>

      <div class="destination-box" id="val-destino">
        <span>📍 Destino:</span> Aguardando dados...
      </div>
    </div>
  </div>

  <script>
    function calcular() {
      const boasInput = document.getElementById("input-boas").value;
      const defeitosInput = document.getElementById("input-defeitos").value;

      // Converte para número ou assume 0 se vazio
      const boas = parseInt(boasInput) || 0;
      const defeitos = parseInt(defeitosInput) || 0;
      const total = boas + defeitos;

      // Evita divisão por zero
      const qualidade = total > 0 ? ((boas / total) * 100).toFixed(2) : 0;

      // Atualiza os valores na tela
      document.getElementById("val-total").innerText = total;
      document.getElementById("val-qualidade").innerText = qualidade + "%";

      // Lógica de Roteamento Inteligente (Destino da Carga)
      const destinoEl = document.getElementById("val-destino");
      let destinoTexto = "";
      let corBorda = "";
      let corFundo = "";

      if (total === 0) {
        destinoTexto = "⚠️ Insira a quantidade de peças.";
        corBorda = "rgba(148, 163, 184, 0.3)";
        corFundo = "rgba(148, 163, 184, 0.1)";
      } else if (defeitos === 0) {
        destinoTexto = "🚀 Expedição Direta (Qualidade Máxima)";
        corBorda = "rgba(16, 185, 129, 0.4)";
        corFundo = "rgba(16, 185, 129, 0.1)";
        destinoEl.style.color = "var(--success)";
      } else if (qualidade >= 95) {
        destinoTexto = "✅ Setor de Embalagem Padrão";
        corBorda = "rgba(16, 185, 129, 0.4)";
        corFundo = "rgba(16, 185, 129, 0.1)";
        destinoEl.style.color = "var(--success)";
      } else if (qualidade >= 85) {
        destinoTexto = "⚠️ Estação de Retrabalho e Ajuste";
        corBorda = "rgba(245, 158, 11, 0.4)";
        corFundo = "rgba(245, 158, 11, 0.1)";
        destinoEl.style.color = "var(--warning)";
      } else {
        destinoTexto = "❌ Linha de Refugo e Análise de Falhas";
        corBorda = "rgba(239, 68, 68, 0.4)";
        corFundo = "rgba(239, 68, 68, 0.1)";
        destinoEl.style.color = "var(--danger)";
      }

      destinoEl.style.borderColor = corBorda;
      destinoEl.style.background = corFundo;
      destinoEl.innerHTML = `<span>📍 Próximo Destino:</span> ${destinoTexto}`;
    }

    // Executa o cálculo inicial ao carregar a página
    window.onload = calcular;
  </script>

</body>
</html>
